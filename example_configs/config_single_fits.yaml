# -----------------------------------------------------------------------------
# SPECTRA config — single FITS row with explicit column mapping
# Replace the file path, column names, and filter wavelengths for your catalog.
# -----------------------------------------------------------------------------

input:
  type: fits
  filepath: "data/example_catalog.fits"
  row_index: 0
  flux_unit: mJy
  column_mapping:
    id: OBJECT_ID
    ra: RA
    dec: DEC
    flux_columns:
      F275W: F275W_FLUX_MJY
      F336W: F336W_FLUX_MJY
      F438W: F438W_FLUX_MJY
      F555W: F555W_FLUX_MJY
      F814W: F814W_FLUX_MJY
    error_columns:
      F275W: F275W_ERR_MJY
      F336W: F336W_ERR_MJY
      F438W: F438W_ERR_MJY
      F555W: F555W_ERR_MJY
      F814W: F814W_ERR_MJY

filters:
  F275W: 0.270
  F336W: 0.335
  F438W: 0.433
  F555W: 0.531
  F814W: 0.806

ssp_model:
  type: fsps
  redshift: 0.0
  imf: chabrier
  sfh: 0
  dust_type: 2
  add_neb_emission: false

fitting:
  method: ml
  error_floor: 0.05
  parameters: [mass, age, metallicity, dust]
  priors:
    mass: [3.0, 8.0]
    age: [0.001, 13.5]
    metallicity: [-2.5, 0.5]
    dust: [0.0, 2.0]

plotting:
  output_dir: "outputs/single_fits_example"
  show_plots: false
  save_plots: true
  formats: [png]
  dpi: 150

output:
  save_photometry: true
