# config_minimal_plotting.yaml
# Minimal plot output — fast, low-res PNGs only, no residuals or parameter box.
# Useful for quick batch runs where you just need a visual check.

input:
  type: phangs_fits
  filepath: "/path/to/phangs_catalog.fits"
  max_rows: 50

ssp_model:
  type: fsps
  redshift: 0.00184
  imf: kroupa

fitting:
  method: ml
  parameters: [mass, age, metallicity, dust]
  priors:
    mass: [2.0, 9.0]
    age: [0.001, 13.5]
    metallicity: [-2.5, 0.5]
    dust: [0.0, 2.0]
  error_floor: 0.05

plotting:
  output_dir: outputs/minimal_demo
  formats: [png]
  dpi: 100
  figure_size: [8, 5]
  plot_style: minimal
  show_components: false
  show_error_bars: true
  show_residuals: false
  show_parameter_box: false
  show_grid: false

output:
  save_photometry: true
  save_samples: false
