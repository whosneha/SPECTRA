site_name: SPECTRA
site_description: SED fitting pipeline for multi-band photometry
site_author: SPECTRA Team
repo_url: https://github.com/whosneha/SPECTRA
repo_name: SPECTRA

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
      - Configuration: getting-started/configuration.md
  - Reference:
      - Configuration Reference: configuration.md
      - Input Formats: inputs.md
      - Outputs: outputs.md
  - User Guide:
      - Input Data: user-guide/input-data.md
      - Data Loaders: user-guide/data-loaders.md
      - Fitting Methods: user-guide/fitting-methods.md
      - MCMC: user-guide/mcmc.md
      - Visualization: user-guide/visualization.md
      - Batch Processing: user-guide/batch-processing.md
      - SSP Models: user-guide/ssp-models.md
      - External Sources: user-guide/external-sources.md
      - Science Use Cases: user-guide/science-use-cases.md
  - Tutorial:
      - FITS Batch: tutorials/fits-batch.md
  - API:
      - Main Pipeline: api/main.md
  - Examples:
      - Gallery: examples/gallery.md
  - Development:
      - Testing: testing-guide.md
